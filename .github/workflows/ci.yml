name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the Go releases supported by the Go team (go.mod requires 1.26)
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: OpenTelemetry 어댑터 (별도 모듈)
        working-directory: otel
        run: go vet ./... && go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...
          (cd tools/gen && golangci-lint run ./... && go vet ./...)
          (cd otel && golangci-lint run --config ../.golangci.yml ./...)
      - name: 생성 코드가 spec과 일치하는지
        run: go -C tools/gen run . -root ../.. -check
      - name: 런타임 의존성이 없는지
        run: test -z "$(go list -m all | tail -n +2)"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          (cd tools/gen && govulncheck ./...)
          (cd otel && govulncheck ./...)

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (전체 히스토리)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
