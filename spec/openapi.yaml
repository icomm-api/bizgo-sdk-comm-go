openapi: 3.1.0
info:
  title: Bizgo Communication API
  version: 1.2.0
  summary: 비즈고 커뮤니케이션 API (SMS/LMS/MMS, 국제, RCS, 카카오 알림톡·브랜드메시지, 네이버 톡톡)
  description: |
    비즈고(Bizgo) 커뮤니케이션 API의 비공식 OpenAPI 스펙입니다. 원문은 [비즈고 개발자센터](https://developers.bizgo.io/api-sdk/api-reference)이며,
    원문과 다르면 원문을 따릅니다. 문서끼리 다르거나 불명확한 부분은 `x-unverified`로 표시했습니다.

    ## 인증
    콘솔에서 발급한 API Key를 `Authorization` 헤더로 보냅니다. API Key는 허용 IP로 등록한 서버에서만 쓸 수 있습니다.

    ## 응답 구조
    모든 응답은 `common`(게이트웨이 결과)과 `data`(상품 처리 결과)로 나뉩니다. 둘 다 `A000`이어야 성공입니다.
    발송 API는 수신자별 결과(`data.data.destinations[].code`)도 따로 확인해야 합니다.

    ## 호출 한도
    발송 API는 **초당 200 메시지(수신번호 수 기준)**, 그 외 API는 초당 5 요청이 기본입니다. 수신자 200명짜리 발송 요청 1건은 200으로 계산됩니다. 넘으면 HTTP 429 / 코드 A020이 반환됩니다.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-spec-scope: 커뮤니케이션 API 전체 (verify API 제외)
servers:
  - url: https://mars.ibapi.kr
    description: 운영(Production)
  - url: https://sandbox-mars.ibapi.kr
    description: 테스트(Sandbox). 운영과 같은 API Key를 쓰며 실제로 발송되지 않습니다.
security:
  - ApiKeyAuth: []
tags:
  - name: Send
    description: 메시지 발송
  - name: File
    description: 이미지 파일 업로드
  - name: Report
    description: 발송 결과 리포트
  - name: Message
    description: 메시지 상태·이력·통계 조회
  - name: Webhook
    description: 비즈고가 고객 서버로 보내는 웹훅
  - name: Reservation
    description: 예약 발송과 예약 관리
  - name: Insight
    description: 채널별 인사이트(알림톡·브랜드메시지·RCS)
  - name: Kakao
    description: 카카오 발신프로필·카테고리·그룹·제재 관리
  - name: Alimtalk
    description: 알림톡 템플릿 관리
  - name: BrandMessage
    description: 브랜드메시지 동보 발송·템플릿·친구 그룹 관리
  - name: RCS
    description: RCS 브랜드·챗봇·템플릿 관리
  - name: Counsel
    description: 카카오 상담톡
paths:
  /api/comm/v1/send/omni:
    post:
      operationId: sendOmni
      tags:
        - Send
      summary: 통합 발송
      description: |
        SMS/LMS/MMS, 국제, RCS, 알림톡, 브랜드메시지, 네이버 톡톡을 같은 경로로 발송합니다.
        채널은 `messageFlow[]`의 채널 키로 구분하며, 여러 개를 넣으면 앞 메시지가 실패할 때 다음 메시지로 대체발송됩니다.
        수신자는 한 요청에 최대 200명입니다. 접수 결과는 수신자별로 `data.data.destinations[]`에 담기며,
        최종 발송 결과는 리포트(Polling/Webhook/Inquiry)로 확인합니다.

        네트워크 오류로 결과를 모를 때 다시 보내면 중복 발송될 수 있으므로 `idempotencyKey`를 함께 씁니다. `idempotencyKey`를 보낼 때는 `idempotencyTtl`도 함께 보내야 합니다(없으면 A309).
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/mt
      x-sdk-resource: send
      x-sdk-method: omni
      x-sdk-retry: rate_limit_only
      x-sdk-rate: send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOmniRequest'
            examples:
              sms:
                summary: SMS 발송
                value:
                  destinations:
                    - to: '01000000000'
                  messageFlow:
                    - sms:
                        from: '01000000000'
                        text: 인증번호는 123456 입니다.
                  ref: sms-20260330-001
              lms:
                summary: LMS 발송
                value:
                  destinations:
                    - to: '01000000000'
                  messageFlow:
                    - mms:
                        from: '01000000000'
                        title: 주문 안내
                        text: 주문이 정상 접수되었습니다. 배송은 내일부터 시작됩니다.
                  ref: lms-20260330-001
              fallback:
                summary: 알림톡 실패 시 SMS로 대체발송
                value:
                  destinations:
                    - to: '01000000000'
                      replaceWords:
                        name: 홍길동
                  messageFlow:
                    - alimtalk:
                        senderKey: SENDER_KEY_EXAMPLE
                        templateCode: TEMPLATE_CODE_EXAMPLE
                        msgType: AT
                        text: '#{name}님, 주문이 접수되었습니다.'
                    - sms:
                        from: '01000000000'
                        text: '#{name}님, 주문이 접수되었습니다.'
                  idempotencyKey: order-20260330-0001
                  idempotencyTtl: 86400
      responses:
        '200':
          description: 접수 결과입니다. 수신자별 `code`도 함께 확인합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOmniResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: SUCCESS
                  data:
                    destinations:
                      - to: '01000000000'
                        msgKey: 20260424104234546POM101182450000
                        code: A000
                        result: Success
                  ref: sms-20260330-001
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/file/mms:
    post:
      operationId: uploadMmsFile
      tags:
        - File
      summary: MMS 이미지 업로드
      description: MMS 발송용 이미지를 올리고 `fileKey`를 받습니다. 받은 키는 `messageFlow[].mms.fileKey`에 넣습니다(최대 3개).
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/mt
      x-sdk-resource: files
      x-sdk-method: uploadMms
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MmsFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/file/rcs:
    post:
      operationId: uploadRcsFile
      summary: RCS 이미지 업로드
      description: |
        RCS 발송 전에 이미지를 업로드합니다. 응답의 `data.data.media` 값을 발송 요청의
        `messageFlow[].rcs.body.media`에 넣어 사용합니다.
      tags:
        - File
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/rcs
      x-sdk-resource: files
      x-sdk-method: uploadRcs
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RcsFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다. 성공 여부는 `common.authCode`와 `data.code`로 확인합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsFileUploadResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    media: maapfile://MEDIA_KEY_EXAMPLE
                    expired: '2027-04-24T12:16:38+09:00'
  /api/comm/v1/file/brandmessage/default:
    post:
      operationId: uploadBrandMessageDefaultImage
      summary: 브랜드메시지 이미지 업로드
      description: 기본형 브랜드메시지에서 사용하는 이미지를 업로드합니다. 발송 본문에 파일을 직접 첨부하는 API가 아니라 브랜드메시지 템플릿 등록과 구성에 사용할 이미지 URL(`imgUrl`)을 발급받는 API입니다.
      tags:
        - File
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand
      x-sdk-resource: files
      x-sdk-method: uploadBrandMessageDefault
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandMessageDefaultFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다. 성공 시 `data.data.imgUrl`에 브랜드메시지에서 사용할 이미지 URL이 담깁니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandMessageFileUploadResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    imgUrl: https://example.kakao.image/brand-image.jpg
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/file/brandmessage/wide:
    post:
      operationId: uploadBrandMessageWideImage
      summary: 브랜드메시지 와이드 이미지 업로드
      description: 와이드 이미지형 브랜드메시지에서 사용하는 이미지를 업로드합니다. 발급된 `imgUrl`은 브랜드메시지 템플릿 또는 발송 구성에 사용합니다.
      tags:
        - File
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand
      x-sdk-resource: files
      x-sdk-method: uploadBrandMessageWide
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandMessageWideFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다. 성공 시 `data.data.imgUrl`에 브랜드메시지에서 사용할 이미지 URL이 담깁니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandMessageFileUploadResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    imgUrl: https://example.kakao.image/brand-image.jpg
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/file/brandmessage/wideItemList/first:
    post:
      operationId: uploadBrandMessageWideItemListFirstImage
      summary: 브랜드메시지 와이드 리스트 첫번째 이미지 업로드
      description: 와이드 리스트형 브랜드메시지의 첫 번째 리스트 이미지에 사용할 이미지를 업로드합니다.
      tags:
        - File
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand
      x-sdk-resource: files
      x-sdk-method: uploadBrandMessageWideItemListFirst
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandMessageWideItemListFirstFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다. 성공 시 `data.data.imgUrl`에 브랜드메시지에서 사용할 이미지 URL이 담깁니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandMessageFileUploadResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    imgUrl: https://example.kakao.image/brand-image.jpg
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/file/brandmessage/wideItemList:
    post:
      operationId: uploadBrandMessageWideItemListImage
      summary: 브랜드메시지 와이드 리스트 이미지 업로드
      description: 와이드 리스트형 브랜드메시지의 2~4번째 리스트 이미지에 사용할 이미지를 업로드합니다.
      tags:
        - File
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand
      x-sdk-resource: files
      x-sdk-method: uploadBrandMessageWideItemList
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandMessageWideItemListFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다. 성공 시 `data.data.imgUrl`에 브랜드메시지에서 사용할 이미지 URL이 담깁니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandMessageFileUploadResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    imgUrl: https://example.kakao.image/brand-image.jpg
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/file/brandmessage/carouselFeed:
    post:
      operationId: uploadBrandMessageCarouselFeedImage
      summary: 브랜드메시지 캐러셀 피드 이미지 업로드
      description: 캐러셀 피드형 브랜드메시지에서 사용하는 이미지를 업로드합니다.
      tags:
        - File
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand
      x-sdk-resource: files
      x-sdk-method: uploadBrandMessageCarouselFeed
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandMessageCarouselFeedFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다. 성공 시 `data.data.imgUrl`에 브랜드메시지에서 사용할 이미지 URL이 담깁니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandMessageFileUploadResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    imgUrl: https://example.kakao.image/brand-image.jpg
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/file/brandmessage/carouselCommerce:
    post:
      operationId: uploadBrandMessageCarouselCommerceImage
      summary: 브랜드메시지 캐러셀 커머스 이미지 업로드
      description: 캐러셀 커머스형 브랜드메시지에서 사용하는 이미지를 업로드합니다. 전체 캐러셀 이미지 비율은 동일하게 맞춰야 합니다.
      tags:
        - File
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-brand
      x-sdk-resource: files
      x-sdk-method: uploadBrandMessageCarouselCommerce
      x-sdk-retry: rate_limit_only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandMessageCarouselCommerceFileUploadRequest'
      responses:
        '200':
          description: 업로드 결과입니다. 성공 시 `data.data.imgUrl`에 브랜드메시지에서 사용할 이미지 URL이 담깁니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandMessageFileUploadResponse'
              example:
                common:
                  authCode: A000
                  authResult: Success
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: Success
                  data:
                    imgUrl: https://example.kakao.image/brand-image.jpg
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/report/polling:
    get:
      operationId: getReportPolling
      tags:
        - Report
      summary: 리포트 가져오기(Polling)
      description: |
        처리가 끝난 리포트를 가져옵니다. 받은 뒤 `reportId`로 수신 확인(DELETE)을 해야 다음 리포트를 받을 수 있습니다.
        리포트 수신 방식은 API Key별로 콘솔에서 POLLING으로 설정해야 합니다.
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/report
      x-sdk-resource: reports
      x-sdk-method: poll
      x-sdk-retry: safe
      responses:
        '200':
          description: 리포트 목록입니다. 받을 리포트가 없으면 `reportId`는 빈 문자열, `report`는 null입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPollingResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/report/polling/{reportId}:
    delete:
      operationId: ackReportPolling
      tags:
        - Report
      summary: 리포트 수신 확인
      description: 가져오기(GET) 응답의 `reportId`로 수신 확인을 합니다.
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/report
      x-sdk-resource: reports
      x-sdk-method: ack
      x-sdk-retry: safe
      parameters:
        - name: reportId
          in: path
          required: true
          description: 가져오기(GET) 응답에서 받은 리포트 ID입니다.
          schema:
            type: string
      responses:
        '200':
          description: 수신 확인 결과입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/report/inquiry/{msgKey}:
    get:
      operationId: getReportInquiry
      tags:
        - Report
      summary: 리포트 개별조회
      description: 메시지 키 1개의 리포트를 조회합니다. 최대 30일 이전까지 조회할 수 있으며, Polling/Webhook에서 빠진 리포트를 보완하는 데 씁니다.
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/report
      x-sdk-resource: reports
      x-sdk-method: inquiry
      x-sdk-retry: safe
      parameters:
        - $ref: '#/components/parameters/MsgKeyPath'
      responses:
        '200':
          description: 리포트 목록입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInquiryResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/message/statistics:
    get:
      operationId: getMessageStatistics
      tags:
        - Message
      summary: 통계 조회
