              x-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
              x-unverified: 한국어 페이지(Part A)에만 있고 Copy Markdown(Part B)에는 없습니다.
            ref:
              type: string
              description: 발송 요청 시 전달한 참조 필드입니다.
  responses:
    ErrorResponse:
      description: |
        요청이 실패했습니다. 실패 단계에 따라 확인할 코드가 다릅니다.
        - **게이트웨이 단계**(인증·권한·형식): `common.authCode`가 `A000`이 아니고, `data`는 없을 수 있습니다.
          예: 잘못된 API Key → HTTP 401, `common.authCode=A401`, `data` 없음.
        - **상품 처리 단계**: `common.authCode=A000`이고 `data.code`에 실패 코드가 옵니다.

        같은 코드 값이라도 공통부와 개별부에서 뜻이 다를 수 있습니다(예 A301).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
      x-verified: '2026-09-23 sandbox: 잘못된 키 → HTTP 401, authCode=A401, data 없음'
    RateLimited:
      description: |
        호출 한도를 넘었습니다(코드 A020). 기본 한도는 발송 API 초당 200 메시지(요청이 아니라 수신번호 수 기준), 그 외 API 초당 5 요청입니다.
        정상 응답에는 남은 한도를 알려주는 헤더(`X-RateLimit-*` 등)가 없으므로 클라이언트가 호출 속도를 직접 조절하고,
        429를 받으면 지수 백오프로 재시도합니다. `Retry-After` 헤더가 있으면 그 값을 우선합니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
      x-unverified: 429 응답에 Retry-After 헤더가 있는지는 확인되지 않았습니다(정상 응답에는 rate-limit 헤더 없음, 2026-09-23 sandbox).
  parameters:
    MsgKeyPath:
      name: msgKey
      in: path
      required: true
      description: 조회할 메시지 키입니다.
      schema:
        type: string
    ResvKeyPath:
      name: resvKey
      in: path
      required: true
      description: 예약 발송 키입니다. 예약 발송 등록 응답의 `data.resvKey` 값입니다.
      schema:
        type: string
      example: RESV_KEY_EXAMPLE
    InsightStartDateQuery:
      name: startDate
      in: query
      required: true
      description: 조회 시작일(YYYYMMDD)입니다.
      schema:
        type: string
        x-format: yyyyMMdd
      example: '20251101'
      x-unverified: 조회할 수 있는 최대 기간(시작일~종료일 범위)과 과거 조회 가능 기간이 문서에 없습니다.
    InsightEndDateQuery:
      name: endDate
      in: query
      required: true
      description: 조회 종료일(YYYYMMDD)입니다.
      schema:
        type: string
        x-format: yyyyMMdd
      example: '20251130'
    InsightSenderKeyQuery:
      name: senderKey
      in: query
      required: true
      description: 발신프로필 키입니다. 여러 개를 조회하려면 콤마(,)로 구분해 전달합니다.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        items:
          type: string
      example:
        - SENDER_KEY_EXAMPLE
      x-unverified: 한 번에 넣을 수 있는 senderKey 최대 개수가 문서에 없습니다.
    InsightTemplateCodeQuery:
      name: templateCode
      in: query
      required: false
      description: 템플릿 코드입니다. 여러 개를 조회하려면 콤마(,)로 구분해 전달합니다. 넣지 않으면 전체를 조회합니다.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      example:
        - TEMPLATE_CODE_EXAMPLE
    RcsBrandIdPath:
      name: brandId
      in: path
      required: true
      description: RCS 브랜드 ID입니다.
      schema:
        type: string
      example: BRAND_ID_EXAMPLE
    InsightRcsGroupIdQuery:
      name: groupId
      in: query
      required: true
      description: |
        그룹 ID입니다. RCS 발송 요청에 넣은 `messageFlow[].rcs.groupId` 값이어야 합니다.
        발송 시 `groupId`를 넣지 않은 건은 집계되지 않습니다.
      schema:
        type: string
    InsightRcsChatbotIdQuery:
      name: chatbotId
      in: query
      required: false
      description: 챗봇 ID입니다. 지정하면 해당 챗봇으로 범위를 좁힙니다.
      schema:
        type: string
    WebhookTimestampHeader:
      name: X-IB-Timestamp
      in: header
      required: true
      description: |
        웹훅 전송 시점의 타임스탬프입니다. 문서 예시 값은 epoch 밀리초(`1743381600000`)입니다.
        이 헤더 값이 `X-IB-Signature` 서명의 HMAC 입력(message)입니다.
      schema:
        type: string
        pattern: ^[0-9]+$
    WebhookSignatureHeader:
      name: X-IB-Signature
      in: header
      required: true
      description: |
        보안 서명입니다. `HmacSHA256(secret, X-IB-Timestamp)`로 생성됩니다(key = 웹훅 secret, message = `X-IB-Timestamp` 헤더 값).
        서명 헤더는 `X-IB-Signature`와 `X-IB-Timestamp` 두 개만 사용합니다.
        secret은 웹훅 검증 전용 값이며 비즈고에 요청하면 별도로 전달받습니다.
        수신 측은 서명과 timestamp 허용 오차를 검증하고, HTTPS와 발신 IP 허용 목록을 함께 적용하며, `msgKey` 기준으로 중복 처리하고,
        중요한 판단 전에는 조회 API로 결과를 확인하는 것을 권장합니다.
      x-unverified: 서명 출력 인코딩(hex/base64)은 아직 확인되지 않았습니다. SDK는 hex(대소문자 무시)와 base64를 모두 허용합니다.
      schema:
        type: string
