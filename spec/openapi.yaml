components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        콘솔 `발송관리 > 연동관리`에서 발급한 통합 API Key를 **접두어 없이** `Authorization` 헤더 값으로 보냅니다.

        ```
        Authorization: {ApiKey}
        ```

        `ApiKey {key}`나 `Bearer {key}` 형식은 HTTP 401 / `A401`로 거절됩니다(2026-09-23 sandbox 확인).
        일부 가이드 문서의 표기와 다르므로 주의합니다.

        API Key는 허용 IP(ACL)로 등록된 서버에서만 쓸 수 있으며, 운영과 sandbox에서 같은 키를 씁니다.
        키는 서버 환경변수 또는 시크릿 저장소에만 보관하고 브라우저·앱에 노출하지 않습니다.
      x-verified: '2026-09-23 sandbox: raw key → 200/A000, `ApiKey ` 접두어 → 401/A401, `Bearer ` 접두어 → 401/A401'
  schemas:
    Destination:
      type: object
      description: 수신자 정보입니다.
      required:
        - to
      properties:
        to:
          type: string
          description: 수신번호입니다. 휴대폰 번호는 11자리 형식을 씁니다(국제메시지는 채널 규격 참고).
          example: '01000000000'
        replaceWords:
          type: object
          description: 치환메시지 변수입니다. 본문·제목의 `#{key}`를 이 값으로 바꿉니다. 알림톡·브랜드메시지 템플릿 자동 치환 발송(`sendType`이 `template`)에서는 필수입니다(각 채널 스키마의 `x-sdk-required-if`).
          additionalProperties:
            type: string
          example:
            name: 홍길동
        ref:
          type: string
          description: 수신자별 참조 필드입니다. 값이 있으면 이 수신번호에는 요청 단위 `ref` 대신 이 값이 리포트에 담깁니다.
    SmsMessage:
      type: object
      description: SMS(단문) 메시지입니다. 제목 필드는 없습니다.
      required:
        - from
        - text
      properties:
        from:
          type: string
          description: 발신번호입니다. 비즈고에 미리 등록한 번호여야 합니다.
          example: '01000000000'
        text:
          type: string
          description: SMS 본문입니다. 최대 90byte이며, 이통사 규격상 EUC-KR 범위 밖 문자는 접수 오류가 날 수 있습니다.
          x-max-bytes: 90
          x-charset: EUC-KR
        ttl:
          type: string
          description: 이통사 전달까지 유효한 최대 시간(초)입니다. 시간이 지나면 실패 처리됩니다.
          pattern: ^[0-9]+$
        originCID:
          type: string
          description: 최초 발신사업자 식별코드(9자리)입니다. 일반 고객은 입력하지 않습니다.
    SmsFlowItem:
      type: object
      title: SMS
      required:
        - sms
      additionalProperties: false
      properties:
        sms:
          $ref: '#/components/schemas/SmsMessage'
    MmsMessage:
      type: object
      description: |
        LMS(장문) 또는 MMS(이미지+장문) 메시지입니다. `fileKey`가 있으면 MMS, 없으면 LMS로 발송됩니다.
      required:
        - from
        - text
      properties:
        from:
          type: string
          description: 발신번호입니다. 비즈고에 미리 등록한 번호여야 합니다.
          example: '01000000000'
        title:
          type: string
          description: 제목입니다.
        text:
          type: string
          description: 본문입니다. 최대 2,000byte이며, 이통사 규격상 EUC-KR 범위 밖 문자는 접수 오류가 날 수 있습니다.
          x-max-bytes: 2000
          x-charset: EUC-KR
        fileKey:
          type: array
          description: 이미지 업로드(`POST /api/comm/v1/file/mms`)로 받은 파일 키입니다. MMS 발송 시 필수이며 최대 3개입니다. 이미지 순서는 보장되지 않습니다.
          minItems: 1
          maxItems: 3
          items:
            type: string
          example:
            - FILE_KEY_001
        ttl:
          type: string
          description: 이통사 전달까지 유효한 최대 시간(초)입니다. 시간이 지나면 실패 처리됩니다.
          pattern: ^[0-9]+$
        originCID:
          type: string
          description: 최초 발신사업자 식별코드(9자리)입니다. 일반 고객은 입력하지 않습니다.
    MmsFlowItem:
      type: object
      title: LMS/MMS
      required:
        - mms
      additionalProperties: false
      properties:
        mms:
          $ref: '#/components/schemas/MmsMessage'
    InternationalMessage:
      type: object
      description: |
        국제메시지(해외 수신자 대상 문자)입니다. `messageFlow[].international` 객체로 보냅니다.
        본문은 UTF-8을 지원하며, 실제 단말 전달 여부와 무관하게 접수 기준으로 과금됩니다.

        수신번호 규칙(`destinations[].to`): 국가번호를 포함한 E.164 형식에서 `+`를 뺀 숫자로 입력합니다
        (예: `821000000000`, 길이 8~15자리). 국가번호 목록이나 국가별 길이·세그먼트(분할) 규칙은 원문에 없습니다.

        국제문자에서는 `title`, `fileKey`를 쓸 수 없습니다(접수코드 A321).
      required:
        - from
        - text
      properties:
        from:
          type: string
          description: 발신번호입니다.
          example: '01000000000'
        text:
          type: string
          description: 국제메시지 본문입니다. 최대 1,000자이며 UTF-8로 인코딩됩니다(글자 수 기준, 바이트 제한 아님).
          maxLength: 1000
          x-charset: UTF-8
          example: Your verification code is 000000.
        ttl:
          type: string
          description: 메시지 유효 시간(초)입니다. 생략하면 86400(24시간)입니다.
          default: '86400'
        clientSubId:
          type: string
          description: Sender ID, 메시지 서명을 복수로 지정하기 위한 구분자입니다. 최대 20자입니다.
          maxLength: 20
          example: sender-id-01
    InternationalFlowItem:
      type: object
      title: International
      required:
        - international
      additionalProperties: false
      properties:
        international:
          $ref: '#/components/schemas/InternationalMessage'
    RcsBody:
      type: object
      description: RCS 메시지 본문입니다. 입력할 수 있는 항목은 `formatId`로 지정한 포맷에 따라 다릅니다.
      x-unverified: 포맷별로 title/description/media 중 어떤 항목이 필수인지와 길이 제한이 문서화되어 있지 않습니다.
      properties:
        title:
          type: string
          description: 메시지 제목입니다.
        description:
          type: string
          description: 메시지 본문입니다.
        media:
          type: string
