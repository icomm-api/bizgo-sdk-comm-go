    post:
      operationId: requestKakaoSenderToken
      tags:
        - Kakao
      summary: 카카오 채널 인증 토큰 요청
      description: |
        발신프로필 등록에 필요한 카카오톡 채널 인증 토큰을 요청합니다.

        발신프로필 등록 흐름:
        1. 이 API에 채널 아이디(`yellowId`)와 채널 알림을 받는 관리자 전화번호(`phoneNumber`)를 보냅니다.
        2. 그 전화번호에 연결된 카카오톡이 채널을 차단하지 않았다면 카카오가 해당 카카오톡으로 인증 토큰을 보냅니다.
        3. 받은 토큰과 같은 전화번호를 헤더(`token`, `phoneNumber`)에 넣어 발신프로필 등록(`POST /api/comm/v1/account/kakao/sender`)을 호출합니다.

        인증받은 토큰은 7일 동안 비즈메시지 센터 서버에 보관됩니다. 다시 호출하면 토큰이 또 발송되므로 자동 재시도하지 않습니다.
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-common
      x-sdk-resource: kakao.senders
      x-sdk-method: requestToken
      x-sdk-retry: rate_limit_only
      x-sdk-result: data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoSenderTokenRequest'
            example:
              yellowId: '@KAKAO_CHANNEL_ID_EXAMPLE'
              phoneNumber: '01000000000'
      responses:
        '200':
          description: 토큰 요청 결과입니다. 이 응답에는 `data.kakao`가 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoSenderAccountResponse'
              example:
                common:
                  authCode: A000
                  authResult: SUCCESS
                  infobankTrId: Infobank-Tracking-Id
                data:
                  code: A000
                  result: SUCCESS
                  resultMsg: 요청 성공
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/comm/v1/account/kakao/sender:
    post:
      operationId: createKakaoSender
      tags:
        - Kakao
      summary: 인증 토큰으로 발신프로필 등록
      description: |
        카카오톡 채널을 발신프로필로 신규 등록합니다.
        카카오비즈니스 파트너센터에서 비즈니스 인증을 받았고, 프로필이 activated 상태이며 운영자에 의해 차단되지 않은 채널이어야 합니다.
        카카오 채널 인증 토큰 요청(`POST /api/comm/v1/account/kakao/sender/token`)으로 받은 토큰과 그때 쓴 전화번호를 헤더로 보냅니다.

        다른 허브파트너 요청으로 이미 등록된 채널이면 이전에 등록된 발신프로필의 카테고리 코드로 등록됩니다.
        브랜드메시지를 쓰는 발신프로필은 무료수신거부 전화번호·인증번호를 설정할 수 있습니다(타겟팅 M, N, O 사용 시 필수).
      x-source: https://developers.bizgo.io/api-sdk/api-reference/comm/kakao-common
      x-sdk-resource: kakao.senders
      x-sdk-method: create
      x-sdk-retry: rate_limit_only
      x-sdk-result: data.kakao.senderProfile
      parameters:
        - name: token
