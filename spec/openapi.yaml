            requestType:
              type: string
              description: 요청 타입입니다. `write`(메시지 발송), `end`(상담 종료), `endwithbot`(상담 종료 및 봇 전환) 중 하나입니다.
              enum:
                - write
                - end
                - endwithbot
            reportCode:
              type: string
              description: 발송 결과 코드입니다. 카카오 응답 코드를 비즈고 코드로 변환한 값이며 `A000`이면 성공입니다.
            reportText:
