title = "bizgo-sdk-comm-go gitleaks config"

[extend]
useDefault = true

# 예시에 실제 API Key를 쓴 경우 (placeholder {ApiKey}, $BIZGO_API_KEY 등은 제외)
[[rules]]
id = "bizgo-authorization-literal"
description = "Literal credential in an Authorization header example"
regex = '''(?i)authorization["']?\s*[:=]\s*["']?(?:bearer |apikey )?([A-Za-z0-9._~+/=-]{20,})'''
secretGroup = 1
keywords = ["authorization"]

[rules.allowlist]
description = "references to environment variables are not secrets"
regexes = ['''^(process\.env|System\.getenv|os\.environ|getenv|env\.)''']

# 실제 휴대폰 번호 (placeholder 010-0000-0000 / 01000000000 계열은 가운데 자리가 0으로 시작해서 제외)
[[rules]]
id = "kr-mobile-number"
description = "Korean mobile phone number (possible PII)"
regex = '''\b01[016789]-?[1-9][0-9]{2,3}-?[0-9]{4}\b'''
keywords = ["010", "011", "016", "017", "018", "019"]

[allowlist]
description = "lockfiles"
paths = [
  '''go\.sum''',
  '''package-lock\.json''',
]
